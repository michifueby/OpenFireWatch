# OpenFireWatch frontend — SPA hosting + single-origin proxy to the backend.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular SPA: unknown paths fall back to index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache policy for a hashed-bundle SPA:
    #   index.html  -> never cached. It names the current bundle hashes, so a
    #                  stale copy pins visitors to the previous release even
    #                  after a successful deploy.
    #   hashed asset -> cached forever. The filename changes whenever the
    #                  content does, so it can never go stale.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ~* \.(?:js|css|svg|png|jpe?g|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # REST + Swagger → NestJS backend (service name on the compose network).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Socket.IO → backend, with WebSocket upgrade headers.
    location /socket.io/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
}

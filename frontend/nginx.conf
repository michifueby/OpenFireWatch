# OpenFireWatch frontend — SPA hosting + single-origin proxy to the backend.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular SPA: unknown paths fall back to index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache policy for a hashed-bundle SPA:
    #   index.html  -> never cached. It names the current bundle hashes, so a
    #                  stale copy pins visitors to the previous release even
    #                  after a successful deploy.
    #   hashed asset -> cached forever. The filename changes whenever the
    #                  content does, so it can never go stale.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ~* \.(?:js|css|svg|png|jpe?g|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # REST + Swagger → NestJS backend (service name on the compose network).
    location /api/ {
        # Through a VARIABLE, so nginx re-resolves the name per request via
        # Docker's embedded DNS instead of pinning the IP it saw at startup.
        # With a literal proxy_pass, every rebuild of the backend container
        # changed its address and left nginx answering 502 until this
        # container was restarted too — an outage that looks like a backend
        # crash and is actually a stale cache.
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://backend:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The backend rate-limits per client. Without this it sees only this
        # container's address and counts every visitor in the world as one
        # caller — which would let a single scraper lock out the responders
        # the limit exists to protect.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO → backend, with WebSocket upgrade headers.
    location /socket.io/ {
        resolver 127.0.0.11 valid=10s;
        set $ws_upstream http://backend:8000;
        proxy_pass $ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
}

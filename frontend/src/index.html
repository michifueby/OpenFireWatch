<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Title and <html lang> are updated at runtime by TranslationService. -->
    <title>OpenFireWatch — Live Thermal Anomaly Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Open-source geospatial early warning system for thermal anomalies."
    />

    <!-- Favicon: SVG for modern browsers (crisp at every density). -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <!-- Apple touch icons ignore SVG, so the full mark serves as fallback. -->
    <link rel="apple-touch-icon" href="logo.svg" />
    <!-- Tints the browser UI on mobile to match the dark command-center theme. -->
    <meta name="theme-color" content="#05070c" />

    <!-- Social preview (link unfurls in chats, issue trackers, etc.). -->
    <meta property="og:title" content="OpenFireWatch" />
    <meta
      property="og:description"
      content="Geospatial early warning system for thermal anomalies — from satellite pass to map alert in seconds."
    />
    <meta property="og:image" content="logo.svg" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <ofw-root></ofw-root>
  </body>
</html>
